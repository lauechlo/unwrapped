<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unwrapped OG Image Template</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0a0a0a;
    }

    .og-container {
      width: 1200px;
      height: 630px;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle gradient orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      top: -150px;
      left: -100px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      bottom: -100px;
      right: -100px;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .title {
      font-size: 96px;
      font-weight: 700;
      background: linear-gradient(135deg, #f472b6, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 32px;
      letter-spacing: -3px;
    }

    .tagline {
      font-size: 28px;
      color: #e5e5e5;
      font-weight: 400;
    }

    .domain {
      position: absolute;
      bottom: 40px;
      color: #6b7280;
      font-size: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <!-- Subtle gradient orbs for depth -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main content -->
    <div class="content">
      <div class="title">Unwrapped</div>
      <div class="tagline">Spotify shows what you listen to. We show who you are.</div>
    </div>

    <!-- Domain -->
    <div class="domain">unwrapped.fm</div>
  </div>
</body>
</html>
